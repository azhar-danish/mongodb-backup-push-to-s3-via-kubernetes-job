apiVersion: batch/v1
kind: Job

metadata:
  name: mongodb-backup

spec:

  backoffLimit: 3

  template:

    spec:

      restartPolicy: Never

      containers:

        - name: mongodb-backup

          image: azhardanish9/mongodb-backup:1.1

          env:

            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URI

            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_DATABASE

            - name: S3_BUCKET
              value: "my-mongodb-backups-azhar"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_DEFAULT_REGION
              value: "ap-south-1"

          volumeMounts:

            - name: backup
              mountPath: /backup

      volumes:

        - name: backup
          emptyDir: {}